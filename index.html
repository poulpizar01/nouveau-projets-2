<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oil Roxwood — Salle de marché</title>
<meta name="description" content="Tableau de bord Oil Roxwood en mise en page salle de marché.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app">

  <!-- ===================== RAIL D'ICÔNES ===================== -->
  <aside class="rail">
    <div class="rail__logo" title="Oil Roxwood" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3c1 3.2 3.6 4.4 3.6 7.4A3.6 3.6 0 0 1 8.4 11c0-1 .4-2 1.1-2.8"/>
        <path d="M12 21a5 5 0 0 0 5-5c0-2-1-3-1-3"/>
      </svg>
    </div>

    <!-- Boutons générés depuis la constante NAV (js/app.js) -->
    <nav id="nav" aria-label="Navigation principale" style="display:contents"></nav>

    <div class="rail__spacer"></div>
    <div class="rail__me" title="Diego Herrera · Direction">DH</div>
  </aside>

  <!-- ===================== COLONNE PRINCIPALE ===================== -->
  <div class="main">

    <!-- Bandeau de cotations -->
    <div class="ticker" id="ticker" aria-label="Cotations des produits"></div>

    <!-- Barre supérieure -->
    <header class="topbar">
      <h1 id="pageTitle">Salle de marché</h1>
      <span class="topbar__sub" id="pageSub"></span>
      <span class="spacer"></span>
      <div class="seg">
        <button type="button" aria-pressed="true">Semaine</button>
        <button type="button">Mois</button>
        <button type="button">Campagne</button>
      </div>
      <button class="btn" type="button">Exporter</button>
      <button class="btn btn--go" type="button">Clôture du lundi</button>
    </header>

    <!-- Contenu injecté par js/app.js -->
    <main class="view" id="view"></main>

    <!-- Barre d'état -->
    <div class="statusbar" id="status"></div>
  </div>

</div>

<!-- Infobulle des graphiques -->
<div class="tooltip" id="tooltip"></div>

<script src="js/data.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
